name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The same gates ci.yml runs. ci.yml's push-to-main job runs *concurrently* with
      # this one and cannot block it, so without these a PR that somehow lands red would
      # still deploy. A deploy is the one step that is visible to readers; it gets its
      # own gate rather than trusting a sibling workflow's timing.
      - name: Validate front matter
        run: python scripts/validate_frontmatter.py

      - name: Build site
        run: mkdocs build --strict

      - name: Check internal links
        run: python scripts/check-links.py site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
