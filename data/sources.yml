# Each source repo, and the exact revision the hub's docs were last reconciled against.
# Bump `pinned` ONLY in a PR that also updates the affected pages' `verified_against`.
#
# `id` is the vocabulary for two things and must not drift from either:
#   - a page's `rift_component` front-matter value
#   - the keys of a page's `verified_against` map
# `scripts/validate_frontmatter.py` enforces both against this file.
sources:
  - id: rift
    repo: achird-labs/rift
    site: https://achird-labs.github.io/rift/
    pinned: { release: v0.18.1, commit: c67f78ffb36b0020e7e8c31611cfad81a9b9dfb7, date: 2026-09-29 }
    watch: [docs/, README.md, CHANGELOG.md]

  - id: rift-cluster
    repo: achird-labs/rift-cluster      # renamed from rift-enterprise 2026-08
    site: null                          # → set when its Pages site goes live
    private: true                       # → false after open-sourcing
    pinned: { release: null, commit: 4911edc5abb5d45ec210c909f93115c34fbfc5f8, date: 2026-08-04 }
    watch: [docs/architecture/, docs/rift-cluster-server.md, docs/api/, deploy/, README.md]

  - id: rift-node
    repo: achird-labs/rift-node
    site: https://achird-labs.github.io/rift-node/
    # Pin held at v0.15.0 until npm publishing is fixed: the v0.16.x releases never reached npm
    # (achird-labs/rift-node#184), so the hub stays on the newest version readers can install.
    pinned: { release: v0.15.0, commit: 38680683f937f89e3dd6b23f4161e9f46cd9a756, date: 2026-07-21 }
    watch: [docs/, README.md]

  - id: rift-java
    repo: achird-labs/rift-java
    site: https://achird-labs.github.io/rift-java/
    pinned: { release: v0.3.3, commit: 39b7ad1e2085af8983c8adc22ffb579360697cf8, date: 2026-09-29 }
    watch: [docs/, README.md]

  - id: rift-scala
    repo: achird-labs/rift-scala
    site: https://achird-labs.github.io/rift-scala/
    pinned: { release: v0.3.1, commit: c88faa09a5414a6146f275ba835be89f1d77df63, date: 2026-09-29 }
    watch: [docs/, README.md]

  - id: rift-go
